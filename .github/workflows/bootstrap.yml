name: Bootstrap

on:
  push:
    paths:
      - bootstrap.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source bundle
        run: |
          test -f bootstrap.b64 || { echo "Nothing to unpack"; exit 0; }
          tr -d '\n' < bootstrap.b64 | base64 -d | tar -xJ
          git rm -q bootstrap.b64
          git config user.name "Bhuvann V"
          git config user.email "84656750+bhuvannv13@users.noreply.github.com"
          git add -A
          git commit -m "Add project source"
          git push
